services:
  # Frontend - React + Vite served by Nginx
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.dockerfile
    container_name: tailoros-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - tailoros-net
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Backend - Node.js + Express API
  backend:
    build:
      context: .
      dockerfile: docker/backend.dockerfile
    container_name: tailoros-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/tailoros
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-change-in-production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production}
      - JWT_ACCESS_EXPIRES_IN=${JWT_ACCESS_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - CLIENT_URL=http://localhost
      - CORS_ORIGIN=http://localhost,http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tailoros-net
    volumes:
      - ./backend/src:/app/backend/src
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/backend/src

  # MongoDB - Data persistence
  mongodb:
    image: mongo:latest
    container_name: tailoros-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: tailoros
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - tailoros-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Cache & session store
  redis:
    image: redis:latest
    container_name: tailoros-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tailoros-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:

networks:
  tailoros-net:
    driver: bridge
